name: Nemrawy AI - Unzip, Test & Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Unzip Project + Test + Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. البحث عن ملف ZIP وفك الضغط
      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted_project

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "Extracted files:"
          find extracted_project -maxdepth 3 -type f | head -100

      # 4. اكتشاف مجلد المشروع الحقيقي
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted_project/settings.gradle" ] || \
             [ -f "extracted_project/settings.gradle.kts" ]; then
            PROJECT_DIR="extracted_project"

          else
            SETTINGS_FILE=$(find extracted_project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found after extraction."
            echo "Extracted structure:"
            find extracted_project -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. عرض ملفات المشروع للتأكد
      - name: Inspect project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -300

      # 6. التأكد من Gradle Wrapper
      - name: Check Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew is missing."
            echo "The ZIP must contain the Gradle Wrapper."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          fi

          echo "Gradle Wrapper found successfully."

      # 7. تثبيت Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. تثبيت الأدوات الأساسية
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 9. فحص Gradle
      - name: Gradle environment
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --version

      # 10. Compile
      - name: Compile Debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # 11. Unit Tests
      - name: Run Unit Tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # 12. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 13. البحث عن APK
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 14. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # 15. رفع تقارير الاختبارات
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
