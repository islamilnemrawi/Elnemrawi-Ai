name: Nemrawy AI - Build & Test

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nemrawy-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nemrawy AI
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Setup JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 4. Locate Android project
      #    IMPORTANT:
      #    This only detects the project.
      #    It does NOT move/delete/modify any files.
      # ============================================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "Searching for settings.gradle / settings.gradle.kts..."

          SETTINGS_FILE=$(find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file was found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle settings file:"
          echo "$SETTINGS_FILE"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Show project structure
      # ============================================================
      - name: Inspect project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=========================================="
          echo "Nemrawy AI Project"
          echo "=========================================="

          echo "Project directory:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "*.versions.toml" \
            \) \
            | sort

      # ============================================================
      # 6. Setup Gradle
      # ============================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ============================================================
      # 7. Verify environment
      # ============================================================
      - name: Verify build environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=========================================="
          echo "Java"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "Gradle"
          echo "=========================================="
          gradle --version

          echo ""
          echo "=========================================="
          echo "Android SDK"
          echo "=========================================="
          sdkmanager --list_installed

      # ============================================================
      # 8. Compile Kotlin
      # ============================================================
      - name: Compile Debug Kotlin
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 9. Unit tests
      # ============================================================
      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 10. Build APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 11. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "Generated APK"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."

      # ============================================================
      # 12. APK SHA-256
      # ============================================================
      - name: Generate APK checksum
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          for APK in app/build/outputs/apk/debug/*.apk; do
            echo "=========================================="
            echo "APK: $APK"
            echo "Size:"
            du -h "$APK"
            echo "SHA-256:"
            sha256sum "$APK"
          done

      # ============================================================
      # 13. Upload APK
      # ============================================================
      - name: Upload Nemrawy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Debug-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 14. Upload test reports
      # ============================================================
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Test-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests/**
            ${{ steps.project.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 15. Upload build reports
      # ============================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Build-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
