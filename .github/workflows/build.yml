name: Nemrawy AI - Build, Test & APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nemrawy-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nemrawy AI
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Java 17
      # AGP 9.1.x compatible
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 4. Detect project structure
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          echo "=========================================="
          echo "Nemrawy AI Project"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Root files:"
          find . -maxdepth 2 -type f | sort | head -300

          echo ""
          echo "Gradle files:"
          find . -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | sort

      # ============================================================
      # 5. Setup Gradle
      # ============================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # ============================================================
      # 6. Verify Gradle / Java / Android
      # ============================================================
      - name: Verify build environment
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed

      # ============================================================
      # 7. Compile Kotlin
      # ============================================================
      - name: Compile Debug Kotlin
        run: |
          gradle :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 8. Unit Tests
      # ============================================================
      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 9. Assemble Debug APK
      # ============================================================
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 10. Verify APK exists
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          echo "=========================================="
          echo "Generated APK files"
          echo "=========================================="

          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."

      # ============================================================
      # 11. APK information
      # ============================================================
      - name: APK information
        shell: bash
        run: |
          for APK in app/build/outputs/apk/debug/*.apk; do
            echo "=========================================="
            echo "APK: $APK"
            echo "Size:"
            du -h "$APK"
            echo "SHA-256:"
            sha256sum "$APK"
            echo "=========================================="
          done

      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload Nemrawy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 13. Upload test reports
      # ============================================================
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Test-Reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 14. Upload build reports
      # ============================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Build-Reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
