name: Nemrawy AI - Build & Test

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nemrawy-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nemrawy AI
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 4. Find the uploaded ZIP
      # ============================================================
      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          echo "Searching for Nemrawy AI ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Extract project
      #
      # IMPORTANT:
      # This only extracts the ZIP.
      # It does NOT delete or modify anything inside the ZIP.
      # ============================================================
      - name: Extract Nemrawy AI project
        shell: bash
        run: |
          mkdir -p extracted_project

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted_project

          echo "Project extracted successfully."

          echo ""
          echo "Extracted structure:"
          find extracted_project -maxdepth 4 -type f | sort | head -500

      # ============================================================
      # 6. Locate Gradle project
      # ============================================================
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          echo "Searching extracted project for Gradle settings..."

          SETTINGS_FILE=$(find extracted_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."

            echo ""
            echo "Extracted files:"
            find extracted_project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle settings:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. Inspect project
      # ============================================================
      - name: Inspect Nemrawy AI project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=========================================="
          echo "NEMRAWY AI PROJECT"
          echo "=========================================="

          echo ""
          echo "Project path:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "*.versions.toml" \
            \) \
            | sort

      # ============================================================
      # 8. Setup Gradle 9.3.1
      # ============================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ============================================================
      # 9. Verify environment
      # ============================================================
      - name: Verify build environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="
          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          sdkmanager --list_installed

      # ============================================================
      # 10. Compile Kotlin
      # ============================================================
      - name: Compile Debug Kotlin
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 11. Run Unit Tests
      # ============================================================
      - name: Run Unit Tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 12. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 13. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."

      # ============================================================
      # 14. APK information
      # ============================================================
      - name: APK information
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          for APK in app/build/outputs/apk/debug/*.apk; do

            echo "=========================================="
            echo "APK FILE"
            echo "=========================================="

            echo "Path:"
            echo "$APK"

            echo ""
            echo "Size:"
            du -h "$APK"

            echo ""
            echo "SHA-256:"
            sha256sum "$APK"

            echo ""
          done

      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload Nemrawy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Debug-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 16. Upload Unit Test Reports
      # ============================================================
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Test-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests/**
            ${{ steps.project.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 17. Upload Build Reports
      # ============================================================
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Build-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
