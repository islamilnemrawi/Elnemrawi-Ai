name: Elnemrawi AI - Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP, Test and Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP found:"
          echo "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "ZIP extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            find extracted_project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Inspect Gradle files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "Gradle files"
          echo "================================"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle*" \
              -o \
              -name "build.gradle*" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print

          echo ""
          echo "================================"
          echo "Project root"
          echo "================================"

          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Gradle command
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Using project Gradle Wrapper."
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "Gradle Wrapper is missing."
            echo "Using GitHub-hosted Gradle."
          fi

      - name: Show Gradle version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          $GRADLE_CMD --version

      - name: Compile Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          $GRADLE_CMD \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Run Unit Tests
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          $GRADLE_CMD \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          $GRADLE_CMD \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elnemrawi-AI-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elnemrawi-AI-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
