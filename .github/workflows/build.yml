name: Nemrawy AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nemrawy-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nemrawy AI APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout GitHub Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Setup JDK 21
      # IMPORTANT:
      # No Gradle cache here because the Android project is inside ZIP.
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          java-package: jdk
          check-latest: false

      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. Install Required Android SDK Packages
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK ready."

      # ============================================================
      # 5. Locate Nemrawy AI ZIP
      # ============================================================
      - name: Locate Nemrawy AI ZIP
        id: locate_zip
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Nemrawy AI ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -name "*.zip" \
            ! -path "./.git/*" \
            -print \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "=========================================="
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"
          echo "=========================================="

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. Extract Nemrawy AI Project
      # ============================================================
      - name: Extract Nemrawy AI project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted_project

          mkdir -p extracted_project

          echo "Extracting:"
          echo "${{ steps.locate_zip.outputs.zip_file }}"

          unzip -q \
            "${{ steps.locate_zip.outputs.zip_file }}" \
            -d extracted_project

          chmod -R u+rwX extracted_project

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted project structure:"
          find extracted_project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

      # ============================================================
      # 7. Locate Actual Gradle Project
      # ============================================================
      - name: Locate Gradle project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Gradle settings file..."

          SETTINGS_FILE=$(find extracted_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."

            echo ""
            echo "Extracted files:"
            find extracted_project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "=========================================="
          echo "GRADLE PROJECT FOUND"
          echo "=========================================="
          echo "Settings:"
          echo "$SETTINGS_FILE"
          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module was not found."
            echo ""
            echo "Directories:"
            find "$PROJECT_DIR" \
              -maxdepth 3 \
              -type d \
              | sort
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. Verify Project Files
      # ============================================================
      - name: Verify Nemrawy AI project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PROJECT VERIFICATION"
          echo "=========================================="

          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle files:"

          find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "*.versions.toml" \
            \) \
            | sort

          echo ""
          echo "Android app module:"
          test -d app

          echo ""
          echo "Project verification completed."

      # ============================================================
      # 9. Setup Gradle
      # IMPORTANT:
      # This happens AFTER ZIP extraction.
      # ============================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ============================================================
      # 10. Verify Java / Gradle / Android Environment
      # ============================================================
      - name: Verify build environment
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed

          echo ""
          echo "=========================================="
          echo "ENVIRONMENT READY"
          echo "=========================================="

      # ============================================================
      # 11. Prepare Debug Keystore
      # ============================================================
      - name: Prepare debug signing
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "debug.keystore" ]; then

            echo "debug.keystore not found."
            echo "Creating standard Android debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "Existing debug.keystore found."
            echo "Keeping existing file."

          fi

          echo "Debug signing ready."

      # ============================================================
      # 12. Compile Debug Kotlin
      # ============================================================
      - name: Compile Debug Kotlin
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COMPILE DEBUG KOTLIN"
          echo "=========================================="

          gradle \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 13. Run Unit Tests
      # ============================================================
      - name: Run Unit Tests
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RUNNING UNIT TESTS"
          echo "=========================================="

          gradle \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 14. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 15. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          echo "Checking APK output..."

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERROR: No APK was generated."

            echo ""
            echo "Available build outputs:"
            find app/build/outputs \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=========================================="

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 16. APK Information + SHA256
      # ============================================================
      - name: APK Information
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          for APK in app/build/outputs/apk/debug/*.apk; do

            echo ""
            echo "APK:"
            echo "$APK"

            echo ""
            echo "Size:"
            du -h "$APK"

            echo ""
            echo "SHA-256:"
            sha256sum "$APK"

          done

      # ============================================================
      # 17. Upload APK Artifact
      # ============================================================
      - name: Upload Nemrawy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Debug-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18. Upload Unit Test Reports
      # ============================================================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Test-Reports
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/app/build/reports/tests/**
            ${{ steps.locate_project.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30

      # ============================================================
      # 19. Upload Build Reports
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Build-Reports
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 30
