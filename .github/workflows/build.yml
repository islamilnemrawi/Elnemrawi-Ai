name: Nemrawy AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nemrawy-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nemrawy AI APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Java 21
      # ============================================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 4. Locate latest Nemrawy ZIP
      # ============================================================
      - name: Locate Nemrawy AI ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -name "*.zip" \
            ! -path "./.git/*" \
            -print \
            | sort \
            | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Nemrawy AI ZIP file found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Extract project
      # ============================================================
      - name: Extract Nemrawy AI project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q \
            "${{ steps.zip.outputs.zip_file }}" \
            -d extracted_project

          chmod -R u+rwX extracted_project

          echo "Project extracted successfully."

          find extracted_project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

      # ============================================================
      # 6. Locate Gradle project
      # ============================================================
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find extracted_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find extracted_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module was not found."
            echo "Project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. Setup Gradle 9.3.1
      # ============================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ============================================================
      # 8. Verify environment
      # ============================================================
      - name: Verify build environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed

          echo "===== PROJECT ====="
          pwd
          ls -la

      # ============================================================
      # 9. Create debug keystore if missing
      # ============================================================
      - name: Prepare debug signing
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug signing configuration ready."

      # ============================================================
      # 10. Compile Kotlin
      # ============================================================
      - name: Compile Debug Kotlin
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 11. Run Unit Tests
      # ============================================================
      - name: Run Unit Tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 12. Build APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ============================================================
      # 13. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory was not created."
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            find app/build/outputs -type f | sort || true
            exit 1
          fi

          echo "======================================"
          echo "Nemrawy AI APK generated successfully"
          echo "======================================"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 14. APK information + checksum
      # ============================================================
      - name: APK Information
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          for APK in app/build/outputs/apk/debug/*.apk; do
            echo "--------------------------------------"
            echo "APK: $APK"
            echo "Size:"
            du -h "$APK"

            echo "SHA-256:"
            sha256sum "$APK"

            echo "--------------------------------------"
          done

      # ============================================================
      # 15. Upload APK
      # ============================================================
      - name: Upload Nemrawy AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. Upload Unit Test Reports
      # ============================================================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Test-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests/**
            ${{ steps.project.outputs.project_dir }}/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30

      # ============================================================
      # 17. Upload Build Reports
      # ============================================================
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nemrawy-AI-Build-Reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 30
