name: Elnemrawi AI - Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP, Test and Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المستودع
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ==========================================
      # 4. تثبيت Android SDK المطلوبة
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ==========================================
      # 5. البحث عن ZIP
      # ==========================================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "=========================================="
            echo "ERROR: No ZIP file found."
            echo "=========================================="
            echo ""
            echo "Files currently inside repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "=========================================="
          echo "ZIP FOUND"
          echo "=========================================="
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 6. فك ZIP
      # ==========================================
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted_project

          mkdir -p extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "=========================================="
          echo "ZIP EXTRACTED SUCCESSFULLY"
          echo "=========================================="

          find extracted_project \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

      # ==========================================
      # 7. اكتشاف مشروع Android
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted_project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "=========================================="
            echo "ERROR: Android Gradle project not found."
            echo "=========================================="

            echo ""
            echo "Extracted project structure:"
            find extracted_project \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 8. فحص ملفات المشروع
      # ==========================================
      - name: Inspect Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500

      # ==========================================
      # 9. التأكد من Gradle Wrapper
      # ==========================================
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Gradle Wrapper..."

          if [ ! -f "gradlew" ]; then
            echo "=========================================="
            echo "ERROR: gradlew is missing."
            echo "=========================================="
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "=========================================="
            echo "ERROR: gradle-wrapper.jar is missing."
            echo "=========================================="
            exit 1
          fi

          echo "Gradle Wrapper found."

          ./gradlew --version

      # ==========================================
      # 10. Compile Kotlin
      # ==========================================
      - name: Compile Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "COMPILE DEBUG"
          echo "=========================================="

          ./gradlew \
            :app:compileDebugKotlin \
            --stacktrace \
            --no-daemon

      # ==========================================
      # 11. Unit Tests
      # ==========================================
      - name: Run Unit Tests
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "RUNNING UNIT TESTS"
          echo "=========================================="

          ./gradlew \
            :app:testDebugUnitTest \
            --stacktrace \
            --no-daemon

      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ==========================================
      # 13. التحقق من APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "=========================================="
            echo "ERROR: APK was not generated."
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 14. رفع APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Elnemrawi-AI-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # ==========================================
      # 15. رفع تقارير الاختبارات
      # ==========================================
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elnemrawi-AI-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: ignore
